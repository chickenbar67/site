<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chicken Bar — Pilons & Poulet</title>
  <meta name="description" content="Chicken Bar — Pilons de poulet, menus, accompagnements, boissons. Produit halal certifié." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0b0b0b; --fg:#f5f5f5; --muted:#bdbdbd; --line:#1f1f1f;
      --brand1:#ff7a18; --brand2:#ff3d00; --card:#141414;
      --radius:18px; --shadow:0 10px 30px rgba(0,0,0,.35);
      --pill-bg:#161616; --pill-border:#2a2a2a;
      --header-pad:120px;         /* espace sous le header fixe */
    }

    *{box-sizing:border-box}
    html,body{
      margin:0; padding:0; color:var(--fg);
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      scroll-behavior:smooth; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    }
    a{color:inherit; text-decoration:none}

    /* ===== FOND (logo en calque fixe — compatible iPhone) ===== */
    body{ background-color:var(--bg); padding-top:var(--header-pad); }
    .bg-logo{
      position:fixed; inset:0; z-index:0; pointer-events:none;
      background-image:url("logo noir.jpeg");
      background-repeat:no-repeat;
      background-size:580px;             /* taille du logo fond (PC) */
      background-position:center 180px;  /* position verticale */
      opacity:.16; filter:saturate(.9);
    }
    .backdrop{
      position:fixed; inset:0; z-index:1; pointer-events:none;
      background:
        radial-gradient(1200px 600px at 50% 140px, rgba(0,0,0,.18), transparent 60%),
        linear-gradient(to bottom, rgba(0,0,0,.35), rgba(0,0,0,.15) 25%, rgba(0,0,0,.30));
    }

    .wrap{max-width:1100px; margin:0 auto; padding:0 20px; position:relative; z-index:2}

    /* ===== HEADER FIXE ===== */
    header{
      position:fixed; inset:0 0 auto 0; z-index:3;
      background:
        radial-gradient(110% 140% at 10% 10%, rgba(255,122,24,.10), transparent),
        radial-gradient(120% 160% at 90% 10%, rgba(255,61,0,.12), transparent),
        rgba(10,10,10,.58);
      backdrop-filter:saturate(1.05) blur(8px);
      -webkit-backdrop-filter:saturate(1.05) blur(8px);
      border-bottom:1px solid var(--line);
    }
    .topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 0}
    .brand{display:flex; align-items:center; gap:12px}
    .brand img{width:106px; height:106px; object-fit:contain}
    .brand h1{font-size:1.34rem; margin:0; letter-spacing:.5px}

    /* Barre de liens jolie (fixe dans le header) */
    .links-bar{
      display:flex; gap:12px; flex-wrap:wrap; align-items:center; justify-content:flex-end;
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:10px 16px; border-radius:999px; font-weight:800; font-size:.95rem;
      background:var(--pill-bg); border:1px solid var(--pill-border);
      color:var(--fg); box-shadow:var(--shadow);
      transition:transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .pill:hover{ transform:translateY(-2px); border-color:#3a3a3a }
    .pill svg{width:18px; height:18px; display:block}

    /* ===== HERO ===== */
    .hero{ padding:18px 0 24px } /* héro compact car header fixe */
    .badge{
      display:inline-block; padding:7px 12px; border-radius:12px; font-weight:700; letter-spacing:.2px;
      background:rgba(255,122,24,.16); border:1px solid rgba(255,122,24,.35)
    }
    .hero h2{ font-size:2.2rem; margin:.5rem 0 0; line-height:1.15; text-shadow:0 2px 10px rgba(0,0,0,.15) }
    .hero p{ color:var(--muted); margin:.6rem 0 0 }

    /* ===== SECTIONS ===== */
    section{ padding:26px 0 }
    .section-title{
      font-size:1.45rem; letter-spacing:.4px; margin:0 0 16px; position:relative; display:inline-block
    }
    .section-title::after{
      content:""; position:absolute; left:0; bottom:-6px; height:3px; width:64%;
      background:linear-gradient(90deg, var(--brand1), var(--brand2)); border-radius:2px; opacity:.9
    }

    /* Grilles & cartes */
    .grid{ display:grid; gap:16px }
    .grid.cols-2{ grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)) }
    .grid.cols-3{ grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)) }

    .card{
      background:rgba(20,20,20,.64);
      border:1px solid rgba(255,255,255,.07);
      border-radius:var(--radius);
      padding:18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .card:hover{ transform:translateY(-2px); border-color:rgba(255,255,255,.12) }

    .item{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px dashed var(--line) }
    .item:last-child{ border-bottom:none }
    .item .name{ font-weight:900 }
    .item .desc{ color:var(--muted); font-size:.95rem }
    .item .price{
      font-weight:900; background:linear-gradient(90deg,var(--brand1),var(--brand2));
      -webkit-background-clip:text; background-clip:text; color:transparent
    }

    /* Allergènes */
    .legend{display:flex; flex-wrap:wrap; gap:8px}
    .allergen-badge{
      display:inline-block; padding:4px 8px; border:1px solid var(--pill-border);
      border-radius:8px; font-size:.8rem; letter-spacing:.3px; background:var(--pill-bg); color:var(--fg);
    }

    /* Partenaires */
    .logos-partners{ display:flex; flex-wrap:wrap; gap:14px; align-items:center }
    .logo-partenaire{ height:48px; width:auto; display:block; filter: drop-shadow(0 2px 6px rgba(0,0,0,.18)) }

    footer{ border-top:1px solid var(--line); color:var(--muted); padding:26px 0; font-size:.95rem }

    /* ===== MOBILE ===== */
    @media (max-width:540px){
      :root{ --header-pad:128px; }
      .brand img{width:86px; height:86px}
      .brand h1{font-size:1.04rem}
      .hero h2{font-size:1.64rem}

      .bg-logo{ background-size:360px; background-position:center 140px }

      /* barre scrollable si ça déborde */
      .links-bar{
        overflow-x:auto; white-space:nowrap; gap:10px; padding:8px 2px;
        scrollbar-width:none;
      }
      .links-bar::-webkit-scrollbar{ display:none }
      .pill{ padding:8px 14px; font-size:.9rem }
    }
  </style>
</head>

  <!-- Calques fond -->
  <div class="bg-lo
