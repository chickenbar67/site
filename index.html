  <script>
    // Année dynamique
    document.getElementById('y').textContent = new Date().getFullYear();

    // Thème : lecture préférence, bascule, mémorisation
    (function(){
      const root = document.documentElement;
      const btn  = document.getElementById('themeBtn');

      // Récup préférence
      const saved = localStorage.getItem('cb-theme');
      if(saved){ root.setAttribute('data-theme', saved); toggleIcons(saved); }

      // Si pas de sauvegarde, aligner sur préférence OS
      if(!saved){
        const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        root.setAttribute('data-theme', prefersLight ? 'light' : 'dark');
        toggleIcons(prefersLight ? 'light' : 'dark');
      }

      btn.addEventListener('click', () => {
        const curr = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', curr);
        localStorage.setItem('cb-theme', curr);
        toggleIcons(curr);
      });

      function toggleIcons(theme){
        const sun = document.getElementById('sun');
        const moon = document.getElementById('moon');
        if(theme === 'light'){ sun.style.display='none'; moon.style.display='block'; }
        else { sun.style.display='block'; moon.style.display='none'; }
      }
    })();
  </script>
